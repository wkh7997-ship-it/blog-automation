name: Tistory Auto Blog

on:
  schedule:
    - cron: '0 0 * * *' # 매일 UTC 기준 0시 (한국 시간 오전 9시)에 자동 실행
  workflow_dispatch: # 깃허브 웹에서 버튼을 눌러 수동으로 즉시 실행할 수도 있습니다.

jobs:
  run-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automation script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TISTORY_ACCESS_TOKEN: ${{ secrets.TISTORY_ACCESS_TOKEN }}
          TISTORY_BLOG_NAME: ${{ secrets.TISTORY_BLOG_NAME }}
        run: |
          python main.py --once