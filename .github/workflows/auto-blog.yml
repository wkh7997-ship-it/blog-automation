name: Tistory Auto Blog

on:
  schedule:
    # 한국 시간 기준 오전 9시(UTC 00:00) 및 저녁 9시(UTC 12:00) 매일 2회 실행
    - cron: '0 0 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  run-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic requests python-dotenv schedule playwright
          playwright install chromium
          playwright install-deps

      - name: Run automation script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TISTORY_EMAIL: ${{ secrets.TISTORY_EMAIL }}
          TISTORY_PASSWORD: ${{ secrets.TISTORY_PASSWORD }}
          TISTORY_BLOG_URL: ${{ secrets.TISTORY_BLOG_URL }}
        run: |
          python main.py --once --limit 1